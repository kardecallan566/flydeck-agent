[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flydeck-agent"
version = "0.1.0"
description = "Lightweight MaleCNS-based BNB 5-minute prediction agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
connectome = ["pyarrow>=18.0"]
evolution = ["numpy>=1.24"]

[project.scripts]
flydeck = "flydeck.cli:main"
flydeck-bnb = "flydeck.bnb_prediction_cli:main"
flydeck-visual-build = "flydeck.visual_cli:main"
flydeck-bnb-visual = "flydeck.bnb_visual_cli:main"
flydeck-visual-diagnostics = "flydeck.visual_diagnostics_cli:main"
flydeck-scientific = "flydeck.scientific_cli:main"
flydeck-benchmark-vnext = "flydeck.benchmark_vnext_cli:main"
flydeck-pancake-rounds = "flydeck.pancakeswap_rounds_cli:main"
flydeck-evolve = "flydeck.evolution_cli:main"
flydeck-fetch-recent = "flydeck.recent_candles_cli:main"
flydeck-forward = "flydeck.forward_cli:main"
flydeck-append-candles = "flydeck.forward_append_cli:main"
flydeck-diagnose = "flydeck.forward_diagnostics_cli:main"
flydeck-investigate = "flydeck.investigate_cli:main"
flydeck-fill-gap = "flydeck.forward_gap_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
